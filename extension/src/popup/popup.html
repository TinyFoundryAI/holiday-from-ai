<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Holiday from AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Holiday from AI</h1>
    <p class="tagline">Help LinkedIn touch grass, quite literally.</p>
  </header>

  <label class="switch-row" for="enabled">
    <span class="switch-label">
      <span class="switch-title">Enabled</span>
      <span class="switch-hint">Toggle to run the transformation.</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </span>
  </label>

  <label class="row" for="showIndicator">
    <input type="checkbox" id="showIndicator" />
    <span>Show 🌱 on replaced posts</span>
  </label>

  <label class="row" for="soundEnabled">
    <input type="checkbox" id="soundEnabled" />
    <span>Play garden soundtrack 🔊</span>
  </label>

  <p class="footer">
    Built by <a href="https://tinyfoundry.ai" target="_blank" rel="noopener">TinyFoundry</a>.
  </p>

  <script src="popup.js"></script>
</body>
</html>
